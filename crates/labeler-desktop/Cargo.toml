[package]
name = "labeler-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "yolo-labeler"
path = "src/main.rs"

[dependencies]
labeler-core = { path = "../labeler-core" }
labeler-vision = { path = "../labeler-vision" }
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI", rev = "f8035a5f0f7d439d2bebe3479e239c4e6254c626", default-features = false, features = ["windows"] }
anyhow = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

