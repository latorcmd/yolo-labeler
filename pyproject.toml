[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rescue-yolo-labeler"
version = "0.1.0"
description = "Local image review, bounding-box annotation and V-Training detector ZIP export"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
yolo-labeler = "yolo_labeler.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yolo_labeler*"]

[tool.setuptools.package-data]
"yolo_labeler.vendor" = ["PROVENANCE.md"]
